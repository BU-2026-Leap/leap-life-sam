<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Space Invaders</title>
    <style>
        body {
            background-color: #222;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            background-color: black;
            border: 2px solid #0f0;
            box-shadow: 0 0 20px #0f0;
        }
        #ui {
            width: 800px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #0f0;
            border: none;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }
        button:hover { background: #0a0; color: white; }
    </style>
</head>
<body>

    <h1>Space Invaders Arcade</h1>

    <div id="ui">
        <span>Score: <span id="score">0</span></span>
        <span>World Record: <span id="highScore">{{ high_score }}</span> ({{ champion }})</span>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <br>
    <button onclick="startGame()">Start New Game</button>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game State
        let gameRunning = false;
        let score = 0;

        // Player
        const player = { x: 375, y: 550, width: 50, height: 30, speed: 5, color: '#0f0' };

        // Bullets & Enemies
        let bullets = [];
        let enemies = [];
        let enemySpeed = 1;
        let enemyDirection = 1;

        // Input
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) {
                e.preventDefault();
            }
        });
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        // Shooting logic
        let lastShotTime = 0;
        const shootCooldown = 300;

        function update() {
            if (!gameRunning) return;

            // Move Player
            if (keys['ArrowLeft'] && player.x > 0) player.x -= player.speed;
            if (keys['ArrowRight'] && player.x + player.width < canvas.width) player.x += player.speed;

            // Fire Bullet
            if (keys['Space']) {
                const now = Date.now();
                if (now - lastShotTime > shootCooldown) {
                    bullets.push({ x: player.x + 22, y: player.y, width: 6, height: 15, color: '#ff0' });
                    lastShotTime = now;
                }
            }

            // Update Bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= 7;
                if (bullets[i].y < 0) bullets.splice(i, 1);
            }

            // Update Enemies
            let hitWall = false;
            enemies.forEach(enemy => {
                enemy.x += enemySpeed * enemyDirection;
                if (enemy.x + enemy.width > canvas.width || enemy.x < 0) hitWall = true;
            });

            if (hitWall) {
                enemyDirection *= -1;
                enemies.forEach(enemy => enemy.y += 20);
            }

            // Collisions
            bullets.forEach((bullet, bIndex) => {
                enemies.forEach((enemy, eIndex) => {
                    if (
                        bullet.x < enemy.x + enemy.width &&
                        bullet.x + bullet.width > enemy.x &&
                        bullet.y < enemy.y + enemy.height &&
                        bullet.y + bullet.height > enemy.y
                    ) {
                        enemies.splice(eIndex, 1);
                        bullets.splice(bIndex, 1);
                        score += 10;
                        document.getElementById('score').innerText = score;
                    }
                });
            });

            // Game Over Checks
            enemies.forEach(enemy => {
                if (enemy.y + enemy.height >= player.y) gameOver();
            });
            if (enemies.length === 0) {
                spawnEnemies();
                enemySpeed += 0.5;
            }
        }

        function draw() {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (!gameRunning) {
                ctx.fillStyle = 'white';
                ctx.font = '30px Courier';
                ctx.textAlign = "center";
                ctx.fillText("PRESS START TO PLAY", canvas.width/2, canvas.height/2);
                if (score > 0) {
                    ctx.fillText("Final Score: " + score, canvas.width/2, canvas.height/2 + 40);
                }
                return;
            }

            // Draw entities
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            bullets.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, b.y, b.width, b.height);
            });
            enemies.forEach(e => {
                ctx.fillStyle = 'red';
                ctx.fillRect(e.x, e.y, e.width, e.height);
            });
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function spawnEnemies() {
            enemies = [];
            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 8; col++) {
                    enemies.push({
                        x: 50 + col * 80,
                        y: 30 + row * 50,
                        width: 40,
                        height: 30
                    });
                }
            }
        }

        function gameOver() {
            gameRunning = false;
            let name = prompt("GAME OVER! Score: " + score + "\nEnter your name for the scoreboard:");

            if (name) {
                fetch('/submit_score', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ name: name, score: score })
                }).then(() => {
                    window.location.reload();
                });
            }
        }

        function startGame() {
            score = 0;
            document.getElementById('score').innerText = '0';
            bullets = [];
            enemies = [];
            enemySpeed = 1;
            player.x = 375;
            spawnEnemies();
            gameRunning = true;
            document.activeElement.blur();
        }

        gameLoop();

    </script>
</body>
</html>
